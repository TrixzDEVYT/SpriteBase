<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpriteBase — My Collection</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stats-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .stat-pill {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.6rem 1rem;
    }
    .stat-pill .num { font-family: var(--font-display); font-size: 1.3rem; }
    .stat-pill.have .num { color: var(--success); }
    .stat-pill.want .num { color: var(--rarity-rare); }
    .stat-pill .lbl { font-size: 0.78rem; color: var(--text-muted); }
    .progress-pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.6rem 1rem; min-width: 220px;
    }
    .progress-bar-track {
      height: 8px; border-radius: 999px; background: var(--bg);
      overflow: hidden; margin-top: 0.4rem;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #ffd166);
      transition: width 0.3s ease;
    }

    .toolbar-row {
      display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center;
      margin-bottom: 1rem;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap input[type="text"] { margin-bottom: 0; padding-left: 2.2rem; }
    .search-wrap .search-icon {
      position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; font-size: 0.9rem;
    }
    .search-wrap .clear-btn {
      position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 1rem; display: none; padding: 0.2rem;
    }
    .search-wrap.has-text .clear-btn { display: block; }

    .segmented { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .segmented button {
      background: var(--surface); border: none; color: var(--text-muted);
      padding: 0.6rem 1rem; cursor: pointer; font-family: var(--font-body); font-size: 0.85rem;
      white-space: nowrap;
    }
    .segmented button.active { background: var(--accent); color: white; }

    .sort-select { margin-bottom: 0; width: auto; }

    .filters-btn-wrap { position: relative; }
    .filter-count-badge {
      position: absolute; top: -6px; right: -6px;
      background: var(--accent); color: white;
      font-size: 0.68rem; font-weight: 700;
      border-radius: 999px; min-width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
    }

    .filters-toggle-panel {
      display: none;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .filters-toggle-panel.open { display: flex; }
    .filters-toggle-panel > div { flex: 1; min-width: 160px; }
    .filters-toggle-panel select { margin-bottom: 0; }
    .filters-toggle-panel .clear-filters-link {
      background: none; border: none; color: var(--accent);
      cursor: pointer; font-size: 0.85rem; font-family: var(--font-body);
      padding-bottom: 0.7rem;
    }

    .quick-mark-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.8rem 1.2rem; margin-bottom: 1.5rem;
      flex-wrap: wrap; gap: 0.8rem;
    }
    .quick-mark-hints { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); }
    .quick-mark-hints span { display: flex; align-items: center; gap: 0.35rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-have { background: var(--success); }
    .dot-want { background: var(--rarity-rare); }

    .toggle-switch {
      position: relative; width: 42px; height: 24px;
      background: var(--border); border-radius: 999px; cursor: pointer;
      transition: background 0.15s ease; flex-shrink: 0;
    }
    .toggle-switch.on { background: var(--accent); }
    .toggle-switch .knob {
      position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
      background: white; border-radius: 50%; transition: left 0.15s ease;
    }
    .toggle-switch.on .knob { left: 20px; }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem;
    }
    .sprite-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      position: relative;
      cursor: default;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .sprite-tile:hover { transform: translateY(-3px); }
    .sprite-tile.quick-mark { cursor: pointer; }

    .sprite-tile.rarity-common    { box-shadow: 0 0 0 1px rgba(156,163,175,0.3); }
    .sprite-tile.rarity-raro      { box-shadow: 0 0 0 1px rgba(77,166,255,0.4), 0 6px 18px -10px rgba(77,166,255,0.5); }
    .sprite-tile.rarity-epico     { box-shadow: 0 0 0 1px rgba(184,85,242,0.4), 0 6px 18px -10px rgba(184,85,242,0.5); }
    .sprite-tile.rarity-legendario{ box-shadow: 0 0 0 1px rgba(255,165,60,0.4), 0 6px 18px -10px rgba(255,165,60,0.5); }
    .sprite-tile.rarity-mitico    { box-shadow: 0 0 0 1px rgba(255,92,138,0.4), 0 6px 18px -10px rgba(255,92,138,0.5); }
    .sprite-tile.owned { border-color: var(--success); }
    .sprite-tile.wanted { border-color: var(--rarity-rare); }

    .tile-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.4rem; }
    .crown-badge {
      display: flex; align-items: center; gap: 0.2rem;
      font-family: var(--font-display); font-size: 0.9rem; color: #ffd166;
      flex-shrink: 0;
    }
    .crown-badge img { width: 16px; height: 16px; }
    .badge-special { background: rgba(74,222,128,0.15); color: var(--success); }
    .tile-image { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; margin-top: 0.6rem; background: var(--bg); }
    .tile-name {
      font-family: var(--font-display); margin-top: 0.5rem; font-size: 1.05rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .tile-controls { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
    .status-btn {
      flex: 1; text-align: center; padding: 0.4rem 0.3rem;
      border-radius: 8px; font-size: 0.78rem; font-weight: 600;
      border: 1px solid var(--border); background: var(--bg); color: var(--text-muted);
      cursor: pointer; transition: all 0.12s ease;
    }
    .status-btn.have-btn.active { background: rgba(74,222,128,0.18); color: var(--success); border-color: var(--success); }
    .status-btn.want-btn.active { background: rgba(77,166,255,0.18); color: var(--rarity-rare); border-color: var(--rarity-rare); }

    .tile-level-row { margin-top: 0.65rem; }
    .tile-level-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .level-pips { display: flex; gap: 0.3rem; }
    .level-pip {
      flex: 1; height: 8px; border-radius: 4px;
      background: var(--bg); border: 1px solid var(--border);
      cursor: pointer; transition: background 0.12s ease;
    }
    .level-pip.filled { background: #ffd166; border-color: #ffd166; }
    .level-pip.disabled { cursor: not-allowed; opacity: 0.4; }

    .load-more-row { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem; }
    .load-more-row button { display: block; margin: 0.6rem auto 0; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div class="page">
    <div class="collection-header">
      <div>
        <h1>My Collection</h1>
        <p>Track your progress and organize your Sprites.</p>
      </div>
      <div class="stats-row">
        <div class="stat-pill have"><span class="num" id="stat-have">0</span><span class="lbl">Have</span></div>
        <div class="stat-pill want"><span class="num" id="stat-want">0</span><span class="lbl">Want</span></div>
        <div class="stat-pill"><span class="num" id="stat-missing">0</span><span class="lbl">Missing</span></div>
        <div class="progress-pill">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
            <span id="progress-percent" style="color:var(--accent); font-weight:600;">0% Complete</span>
            <span id="progress-fraction" style="color:var(--text-muted);">0 / 0</span>
          </div>
          <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar-fill" style="width:0%;"></div></div>
        </div>
      </div>
    </div>

    <div class="toolbar-row">
      <div class="search-wrap" id="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search Sprites..." />
        <button class="clear-btn" id="clear-search-btn">✕</button>
      </div>
      <select class="sort-select" id="sort-select">
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="rarity">Rarity</option>
        <option value="level">Level</option>
      </select>
      <div class="filters-btn-wrap">
        <button class="btn btn-ghost" id="filters-toggle-btn">⚗ Filters ▾</button>
        <span class="filter-count-badge" id="filter-count-badge" style="display:none;">0</span>
      </div>
    </div>

    <div class="segmented" id="status-segmented" style="margin-bottom: 1rem; width: fit-content;">
      <button class="active" data-mode="all">All <span id="count-all"></span></button>
      <button data-mode="have">Have <span id="count-have"></span></button>
      <button data-mode="want">Want <span id="count-want"></span></button>
      <button data-mode="missing">Missing <span id="count-missing"></span></button>
    </div>

    <div class="filters-toggle-panel" id="filters-panel">
      <div>
        <label for="filter-rarity">Rarity</label>
        <select id="filter-rarity">
          <option value="any">Any</option>
          <option value="common">Common</option>
          <option value="raro">Rare</option>
          <option value="epico">Epic</option>
          <option value="legendario">Legendary</option>
          <option value="mitico">Mythic</option>
        </select>
      </div>
      <div>
        <label for="filter-style">Style</label>
        <select id="filter-style">
          <option value="any">Any</option>
        </select>
      </div>
      <button class="clear-filters-link" id="clear-filters-link">Clear filters</button>
    </div>

    <div class="quick-mark-bar">
      <div>
        <div style="font-weight:600;">⚡ Quick Mark Mode</div>
        <div class="quick-mark-hints">
          <span><span class="dot dot-have"></span>Click = Have</span>
          <span><span class="dot dot-want"></span>Right Click = Want</span>
          <span>Click Again = Clear</span>
        </div>
      </div>
      <div class="toggle-switch on" id="quick-mark-toggle"><div class="knob"></div></div>
    </div>

    <div id="collection-grid" class="collection-grid">
      <p style="color: var(--text-muted); grid-column: 1/-1;">Loading your collection...</p>
    </div>
    <div class="load-more-row" id="load-more-row"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="spriteType.js"></script>
  <script src="spriteNew.js"></script>
  <script src="auth.js"></script>
  <script>
    let currentUser = null;
    let allSprites = [];
    let ownedMap = new Map();   // sprite_id -> { rowId, level }
    let wantedMap = new Map();  // sprite_id -> rowId

    let filterMode = "all";
    let filterRarity = "any";
    let filterStyle = "any";
    let searchTerm = "";
    let sortMode = "name-asc";
    let quickMarkEnabled = true;
    const PAGE_SIZE = 24;
    let visibleCount = PAGE_SIZE;

    const RARITY_LABELS = {
      common: "Common", raro: "Rare", epico: "Epic",
      legendario: "Legendary", mitico: "Mythic",
    };
    const RARITY_ORDER = { common: 0, raro: 1, epico: 2, legendario: 3, mitico: 4 };
    const CROWN_URL = "https://fortnite.gg/img/x/sprites/crown.webp";

    async function loadData() {
      const [{ data: sprites }, { data: owned }, { data: wanted }] = await Promise.all([
        db.from("sprites").select("id, variant_name, rarity, image_url, created_at").eq("is_active", true).order("variant_name"),
        db.from("user_sprites_owned").select("id, sprite_id, level").eq("user_id", currentUser.id),
        db.from("user_sprites_wanted").select("id, sprite_id").eq("user_id", currentUser.id),
      ]);

      allSprites = sprites || [];
      ownedMap = new Map((owned || []).map(o => [o.sprite_id, { rowId: o.id, level: o.level }]));
      wantedMap = new Map((wanted || []).map(w => [w.sprite_id, w.rowId ?? w.id]));

      populateStyleFilter();
      renderStats();
      renderGrid();
    }

    function populateStyleFilter() {
      const styles = new Set(allSprites.map(s => getSpriteType(s.variant_name)));
      const select = document.getElementById("filter-style");
      const current = select.value;
      select.innerHTML = `<option value="any">Any</option>` +
        [...styles].sort().map(s => `<option value="${s}">${s}</option>`).join("");
      select.value = current || "any";
    }

    function renderStats() {
      const total = allSprites.length;
      const haveCount = ownedMap.size;
      const wantCount = wantedMap.size;
      const missingCount = Math.max(total - haveCount - wantCount, 0);
      const percent = total > 0 ? Math.round((haveCount / total) * 100) : 0;

      document.getElementById("stat-have").textContent = haveCount;
      document.getElementById("stat-want").textContent = wantCount;
      document.getElementById("stat-missing").textContent = missingCount;
      document.getElementById("progress-percent").textContent = `${percent}% Complete`;
      document.getElementById("progress-fraction").textContent = `${haveCount} / ${total}`;
      document.getElementById("progress-bar-fill").style.width = `${percent}%`;

      document.getElementById("count-all").textContent = `(${total})`;
      document.getElementById("count-have").textContent = `(${haveCount})`;
      document.getElementById("count-want").textContent = `(${wantCount})`;
      document.getElementById("count-missing").textContent = `(${missingCount})`;
    }

    function updateFilterBadge() {
      const count = (filterRarity !== "any" ? 1 : 0) + (filterStyle !== "any" ? 1 : 0);
      const badge = document.getElementById("filter-count-badge");
      if (count > 0) {
        badge.textContent = count;
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    }

    function getFilteredSprites() {
      let list = allSprites.filter(s => {
        if (searchTerm && !s.variant_name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
        if (filterRarity !== "any" && s.rarity !== filterRarity) return false;
        if (filterStyle !== "any" && getSpriteType(s.variant_name) !== filterStyle) return false;

        const isOwned = ownedMap.has(s.id);
        const isWanted = wantedMap.has(s.id);
        if (filterMode === "have" && !isOwned) return false;
        if (filterMode === "want" && !isWanted) return false;
        if (filterMode === "missing" && (isOwned || isWanted)) return false;

        return true;
      });

      list.sort((a, b) => {
        if (sortMode === "name-asc") return a.variant_name.localeCompare(b.variant_name);
        if (sortMode === "name-desc") return b.variant_name.localeCompare(a.variant_name);
        if (sortMode === "rarity") return (RARITY_ORDER[b.rarity] ?? 0) - (RARITY_ORDER[a.rarity] ?? 0);
        if (sortMode === "level") {
          const la = ownedMap.get(a.id)?.level ?? -1;
          const lb = ownedMap.get(b.id)?.level ?? -1;
          return lb - la;
        }
        return 0;
      });

      return list;
    }

    function levelPipsHtml(spriteId, isOwned, level) {
      let pips = "";
      for (let i = 1; i <= 5; i++) {
        const filled = isOwned && i <= level;
        pips += `<div class="level-pip ${filled ? "filled" : ""} ${isOwned ? "" : "disabled"}" data-level="${i}"></div>`;
      }
      return `
        <div class="tile-level-row" data-static="true">
          <div class="tile-level-label">Level ${isOwned ? level : "—"}</div>
          <div class="level-pips">${pips}</div>
        </div>
      `;
    }

    function tileHtml(sprite) {
      const owned = ownedMap.get(sprite.id);
      const isOwned = !!owned;
      const isWanted = wantedMap.has(sprite.id);
      const type = getSpriteType(sprite.variant_name);
      const isSpecial = type !== "Normal";
      const level = owned?.level ?? 1;
      const showCrown = isOwned && owned.level === 5;

      const badgeHtml = isSpecial
        ? `<span class="badge badge-special">Special</span>`
        : `<span class="badge badge-${sprite.rarity}">${RARITY_LABELS[sprite.rarity] || sprite.rarity}</span>`;

      const crownHtml = showCrown
        ? `<span class="crown-badge"><img src="${CROWN_URL}" alt="Level 5" onerror="this.style.display='none'" />5</span>`
        : "";

      const newBadgeHtml = isNewSprite(sprite.created_at)
        ? `<span class="badge" style="background:rgba(255,209,102,0.2); color:#ffd166;">🆕 NEW</span>`
        : "";

      const tileStateClass = isOwned ? "owned" : (isWanted ? "wanted" : "");

      return `
        <div class="sprite-tile rarity-${sprite.rarity} ${tileStateClass} ${quickMarkEnabled ? "quick-mark" : ""}" data-sprite-id="${sprite.id}" title="${quickMarkEnabled ? 'Click = Have · Right-click = Want' : ''}">
          <div class="tile-top-row">${badgeHtml}${newBadgeHtml}${crownHtml}</div>
          ${sprite.image_url
            ? `<img src="${sprite.image_url}" class="tile-image" onerror="this.style.display='none'" />`
            : `<div class="tile-image" style="display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:1.5rem;">❔</div>`}
          <div class="tile-name" title="${sprite.variant_name}">${sprite.variant_name}</div>
          <div class="tile-controls" data-static="true">
            <button class="status-btn have-btn ${isOwned ? "active" : ""}" data-action="have">✓ Have</button>
            <button class="status-btn want-btn ${isWanted ? "active" : ""}" data-action="want">★ Want</button>
          </div>
          ${levelPipsHtml(sprite.id, isOwned, level)}
        </div>
      `;
    }

    async function setHave(spriteId, on) {
      if (on) {
        if (wantedMap.has(spriteId)) {
          await db.from("user_sprites_wanted").delete().eq("id", wantedMap.get(spriteId));
          wantedMap.delete(spriteId);
        }
        const { data } = await db
          .from("user_sprites_owned")
          .upsert({ user_id: currentUser.id, sprite_id: spriteId, level: 1 }, { onConflict: "user_id,sprite_id" })
          .select()
          .single();
        if (data) ownedMap.set(spriteId, { rowId: data.id, level: data.level });
        db.rpc("check_achievements").then(() => {});
      } else {
        const entry = ownedMap.get(spriteId);
        if (entry) {
          await db.from("user_sprites_owned").delete().eq("id", entry.rowId);
          ownedMap.delete(spriteId);
        }
      }
      renderStats();
    }

    async function setWant(spriteId, on) {
      if (on) {
        if (ownedMap.has(spriteId)) {
          await db.from("user_sprites_owned").delete().eq("id", ownedMap.get(spriteId).rowId);
          ownedMap.delete(spriteId);
        }
        const { data } = await db
          .from("user_sprites_wanted")
          .upsert({ user_id: currentUser.id, sprite_id: spriteId }, { onConflict: "user_id,sprite_id" })
          .select()
          .single();
        if (data) wantedMap.set(spriteId, data.id);
      } else {
        const rowId = wantedMap.get(spriteId);
        if (rowId) {
          await db.from("user_sprites_wanted").delete().eq("id", rowId);
          wantedMap.delete(spriteId);
        }
      }
      renderStats();
    }

    async function setLevel(spriteId, level) {
      const entry = ownedMap.get(spriteId);
      if (!entry) return;
      const clamped = Math.min(5, Math.max(1, level));
      await db.from("user_sprites_owned").update({ level: clamped }).eq("id", entry.rowId);
      entry.level = clamped;
    }

    function renderGrid() {
      const grid = document.getElementById("collection-grid");
      const filtered = getFilteredSprites();
      updateFilterBadge();

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">No Sprites match your search or filters.</div>`;
        document.getElementById("load-more-row").innerHTML = "";
        return;
      }

      const visible = filtered.slice(0, visibleCount);
      grid.innerHTML = visible.map(tileHtml).join("");

      grid.querySelectorAll(".sprite-tile").forEach(tile => {
        const spriteId = tile.dataset.spriteId;

        tile.querySelector(".have-btn").addEventListener("click", async (e) => {
          e.stopPropagation();
          const isActive = e.currentTarget.classList.contains("active");
          await setHave(spriteId, !isActive);
          renderGrid();
        });

        tile.querySelector(".want-btn").addEventListener("click", async (e) => {
          e.stopPropagation();
          const isActive = e.currentTarget.classList.contains("active");
          await setWant(spriteId, !isActive);
          renderGrid();
        });

        tile.querySelectorAll(".level-pip:not(.disabled)").forEach(pip => {
          pip.addEventListener("click", async (e) => {
            e.stopPropagation();
            await setLevel(spriteId, parseInt(pip.dataset.level, 10));
            renderGrid();
          });
        });

        if (quickMarkEnabled) {
          tile.addEventListener("click", async (e) => {
            if (e.target.closest('[data-static="true"]')) return;
            const isOwned = ownedMap.has(spriteId);
            await setHave(spriteId, !isOwned);
            renderGrid();
          });

          tile.addEventListener("contextmenu", async (e) => {
            e.preventDefault();
            if (e.target.closest('[data-static="true"]')) return;
            const isWanted = wantedMap.has(spriteId);
            await setWant(spriteId, !isWanted);
            renderGrid();
          });
        }
      });

      const loadMoreRow = document.getElementById("load-more-row");
      if (visibleCount < filtered.length) {
        loadMoreRow.innerHTML = `
          <div>Loaded ${visible.length} of ${filtered.length}</div>
          <button class="btn btn-ghost" id="load-more-btn">Load more</button>
        `;
        document.getElementById("load-more-btn").addEventListener("click", () => {
          visibleCount += PAGE_SIZE;
          renderGrid();
        });
      } else {
        loadMoreRow.innerHTML = `<div>Loaded ${visible.length} of ${filtered.length}</div>`;
      }
    }

    const searchInput = document.getElementById("search-input");
    const searchWrap = document.getElementById("search-wrap");

    searchInput.addEventListener("input", (e) => {
      searchTerm = e.target.value;
      searchWrap.classList.toggle("has-text", searchTerm.length > 0);
      visibleCount = PAGE_SIZE;
      renderGrid();
    });

    document.getElementById("clear-search-btn").addEventListener("click", () => {
      searchInput.value = "";
      searchTerm = "";
      searchWrap.classList.remove("has-text");
      renderGrid();
    });

    document.getElementById("sort-select").addEventListener("change", (e) => {
      sortMode = e.target.value;
      renderGrid();
    });

    document.querySelectorAll("#status-segmented button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#status-segmented button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filterMode = btn.dataset.mode;
        visibleCount = PAGE_SIZE;
        renderGrid();
      });
    });

    document.getElementById("filters-toggle-btn").addEventListener("click", () => {
      document.getElementById("filters-panel").classList.toggle("open");
    });

    document.getElementById("filter-rarity").addEventListener("change", (e) => {
      filterRarity = e.target.value;
      visibleCount = PAGE_SIZE;
      renderGrid();
    });
    document.getElementById("filter-style").addEventListener("change", (e) => {
      filterStyle = e.target.value;
      visibleCount = PAGE_SIZE;
      renderGrid();
    });

    document.getElementById("clear-filters-link").addEventListener("click", () => {
      filterRarity = "any";
      filterStyle = "any";
      document.getElementById("filter-rarity").value = "any";
      document.getElementById("filter-style").value = "any";
      renderGrid();
    });

    document.getElementById("quick-mark-toggle").addEventListener("click", function () {
      quickMarkEnabled = !quickMarkEnabled;
      this.classList.toggle("on", quickMarkEnabled);
      renderGrid();
    });

    (async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;

      await renderNav("collection.html");
      await loadData();
    })();
  </script>
</body>
</html>
