<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpriteBase — Trades</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .trade-status-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .trade-status-active { background: rgba(74,222,128,0.15); color: var(--success); }
    .trade-status-cancelled { background: rgba(156,163,175,0.15); color: var(--text-muted); }
    .trade-status-completed { background: rgba(77,166,255,0.15); color: var(--rarity-rare); }
    .trade-status-expired { background: rgba(255,107,107,0.15); color: var(--error); }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .top-header-actions { display: flex; gap: 0.6rem; }

    .browse-toolbar {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .browse-toolbar input[type="text"] { margin-bottom: 0; flex: 1; min-width: 200px; }
    .browse-toolbar select { margin-bottom: 0; width: auto; }
    .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .view-toggle button {
      background: var(--surface);
      border: none;
      color: var(--text-muted);
      padding: 0.65rem 0.8rem;
      cursor: pointer;
    }
    .view-toggle button.active { background: var(--accent); color: white; }

    .browse-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 800px) {
      .browse-layout { grid-template-columns: 1fr; }
    }

    .filters-panel label { margin-top: 1rem; }
    .filters-panel label:first-child { margin-top: 0; }
    .filters-header { display: flex; justify-content: space-between; align-items: center; }
    .filters-header button {
      background: none; border: none; color: var(--accent);
      font-size: 0.85rem; cursor: pointer; font-family: var(--font-body);
    }
    .sprite-filter-list { max-height: 200px; overflow-y: auto; margin-top: 0.5rem; }
    .sprite-filter-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0; font-size: 0.85rem;
    }
    .sprite-filter-item input { width: auto; margin: 0; }

    .cards-area.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .cards-area.list-view { display: flex; flex-direction: column; gap: 1rem; }

    .trade-owner { display: flex; align-items: center; gap: 0.6rem; }
    .match-badge {
      font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.5rem;
      border-radius: 999px; background: rgba(139,92,246,0.18); color: var(--accent);
    }

    .chip-row { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.3rem; }
    .chip-row .chip { flex-shrink: 0; }

    .trade-columns-visual {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.8rem;
      align-items: center;
    }
    .swap-icon {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 1rem; flex-shrink: 0;
    }
    .item-slots-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .item-slot {
      width: 52px; height: 52px; border-radius: 10px;
      background: var(--bg); border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0; position: relative;
    }
    .item-slot img { width: 100%; height: 100%; object-fit: cover; }
    .item-slot .placeholder { font-size: 1.3rem; color: var(--text-muted); }

    .contact-reveal {
      margin-top: 0.6rem; padding: 0.6rem 0.8rem;
      background: var(--bg); border-radius: 8px; font-size: 0.85rem;
      color: var(--text-muted); display: none;
    }
    .contact-reveal.open { display: block; }

    .details-panel {
      display: none;
      border-top: 1px solid var(--border);
      margin-top: 0.6rem;
      padding-top: 0.8rem;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .pagination { display: flex; justify-content: center; gap: 0.4rem; margin-top: 2rem; }
    .pagination button {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 0.4rem 0.75rem; border-radius: 8px; cursor: pointer; font-family: var(--font-body);
    }
    .pagination button.active { background: var(--accent); border-color: var(--accent); color: white; }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div class="page">
    <div class="top-header">
      <div>
        <h1>Trades</h1>
        <p>Browse active offers or manage your own.</p>
      </div>
      <div class="top-header-actions">
        <button class="btn btn-ghost" id="top-manage-btn">✎ Manage Trades</button>
        <button class="btn btn-primary" id="top-create-btn">+ Create Trade</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="browse">Browse</button>
      <button class="tab" data-tab="mine">My Trades</button>
    </div>

    <!-- =================== BROWSE =================== -->
    <div id="browse-section">
      <div class="browse-toolbar">
        <input type="text" id="search-input" placeholder="Search trades, players, or sprites..." />
        <select id="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
        <div class="view-toggle">
          <button id="grid-view-btn" class="active" title="Grid view">▦</button>
          <button id="list-view-btn" title="List view">☰</button>
        </div>
      </div>

      <div class="browse-layout">
        <div class="card filters-panel">
          <div class="filters-header">
            <h3 style="margin:0; font-size:1rem;">Filters</h3>
            <button id="clear-filters-btn">Clear</button>
          </div>

          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="any">Any</option>
            <option value="active" selected>Active</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Paused</option>
            <option value="expired">Expired</option>
          </select>

          <label for="filter-match">Match</label>
          <select id="filter-match">
            <option value="any">Any</option>
            <option value="full">Full match</option>
            <option value="partial">Partial match</option>
          </select>

          <label for="filter-rarity">Rarity</label>
          <select id="filter-rarity">
            <option value="any">Any</option>
            <option value="common">Common</option>
            <option value="raro">Rare</option>
            <option value="epico">Epic</option>
            <option value="legendario">Legendary</option>
            <option value="mitico">Mythic</option>
          </select>

          <label for="filter-style">Style</label>
          <select id="filter-style">
            <option value="any">Any</option>
          </select>

          <label for="sprite-filter-search">Sprites</label>
          <input type="text" id="sprite-filter-search" placeholder="Search sprite..." />
          <div class="sprite-filter-list" id="sprite-filter-list"></div>

          <button class="btn btn-primary" id="apply-filters-btn" style="width:100%; margin-top:1.2rem;">Apply Filters</button>
        </div>

        <div>
          <div id="cards-area" class="cards-area grid-view"></div>
          <div id="pagination" class="pagination"></div>
        </div>
      </div>
    </div>

    <!-- =================== MY TRADES =================== -->
    <div id="mine-section" style="display:none;">
      <div id="mine-list" style="display:flex; flex-direction:column; gap: 1rem;"></div>
    </div>

    <!-- =================== CREATE =================== -->
    <div id="create-section" style="display:none;">
      <div class="card" style="margin-bottom: 1.2rem;">
        <label for="trade-title">Title</label>
        <input type="text" id="trade-title" placeholder="Looking for Fishstick, have Gustambo" maxlength="100" />

        <label for="trade-description">Description (optional)</label>
        <textarea id="trade-description" placeholder="Additional details about your offer..." maxlength="2000"></textarea>
      </div>

      <div class="picker-columns">
        <div class="card picker-card">
          <div class="picker-header">
            <div>
              <label style="margin:0;">Offering</label>
              <div class="picker-subtext">From your collection</div>
            </div>
            <button class="btn btn-ghost picker-select-all-btn" id="select-all-offer-btn" style="padding:0.25rem 0.6rem; font-size:0.8rem;">Select all</button>
          </div>
          <input type="text" id="offer-search" class="picker-search" placeholder="Search your Sprites..." />
          <div id="offer-picker-grid" class="picker-grid"></div>
        </div>

        <div class="picker-card-arrow">⇄</div>

        <div class="card picker-card">
          <div class="picker-header">
            <div>
              <label style="margin:0;">Looking for</label>
              <div class="picker-subtext">Optional — leave empty to give away for free</div>
            </div>
            <button class="btn btn-ghost picker-select-all-btn" id="select-all-want-btn" style="padding:0.25rem 0.6rem; font-size:0.8rem;">Select all</button>
          </div>
          <input type="text" id="want-search" class="picker-search" placeholder="Search your wishlist..." />
          <div id="want-picker-grid" class="picker-grid"></div>
        </div>
      </div>

      <div class="section-heading-small">Preview</div>
      <div id="create-preview" class="trade-card" style="margin-bottom: 1.2rem;"></div>

      <div class="card">
        <div id="create-status"></div>
        <button class="btn btn-primary" id="create-trade-btn" style="width:100%;">Post Trade</button>
      </div>
    </div>
  </div>

  <style>
    .picker-columns {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1rem;
      align-items: start;
      margin-bottom: 1.2rem;
    }
    @media (max-width: 700px) {
      .picker-columns { grid-template-columns: 1fr; }
      .picker-card-arrow { display: none; }
    }
    .picker-card-arrow {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 1rem; margin-top: 2.5rem;
    }
    .picker-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.7rem; }
    .picker-subtext { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }
    .picker-search { margin-bottom: 0.8rem; }
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 0.6rem;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 0.2rem;
    }
    .picker-tile {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem;
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: border-color 0.12s ease, transform 0.12s ease;
    }
    .picker-tile:hover { transform: translateY(-2px); }
    .picker-tile.selected { border-color: var(--accent); background: rgba(139,92,246,0.1); }
    .picker-tile img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
    .picker-tile .placeholder-img {
      width: 100%; aspect-ratio: 1; border-radius: 6px;
      background: var(--surface); display:flex; align-items:center; justify-content:center;
      color: var(--text-muted); font-size: 1.2rem;
    }
    .picker-tile-name {
      font-size: 0.7rem; margin-top: 0.35rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .picker-tile-check {
      position: absolute; top: 4px; right: 4px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); color: white;
      display: none; align-items: center; justify-content: center;
      font-size: 0.7rem;
    }
    .picker-tile.selected .picker-tile-check { display: flex; }
    .picker-empty { grid-column: 1/-1; color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 1rem; }
    .section-heading-small {
      font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 0.7rem;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="profanityFilter.js"></script>
  <script src="spriteType.js"></script>
  <script src="auth.js"></script>
  <script>
    let currentUser = null;
    let currentUsername = "you";
    let allTrades = [];       // datos crudos ya cargados de Supabase
    let matchMap = {};        // { ownerUserId: 'full' | 'partial' }
    let allSpritesCatalog = [];
    let selectedSpriteFilterIds = new Set();
    let appliedFilters = { status: "active", match: "any", rarity: "any", style: "any", spriteIds: new Set() };
    let verifiedIds = new Set();
    let viewMode = "grid";
    let currentPage = 1;
    const PAGE_SIZE = 6;

    const RARITY_LABELS = {
      common: "Common", raro: "Rare", epico: "Epic",
      legendario: "Legendary", mitico: "Mythic",
    };

    function timeAgo(dateStr) {
      const diffSec = (Date.now() - new Date(dateStr).getTime()) / 1000;
      if (diffSec < 60) return "just now";
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
      if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
      return `${Math.floor(diffSec / 86400)}d ago`;
    }

    function verifiedCheck(userId) {
      return verifiedIds.has(userId)
        ? `<img src="https://static.vecteezy.com/system/resources/thumbnails/047/309/930/small/verified-badge-profile-icon-png.png" alt="Verified" title="Verified" style="width:16px; height:16px; vertical-align:middle;" />`
        : "";
    }

    const PLATFORM_ICONS = {
      discord: "🎮 Discord",
      twitter: "🐦 Twitter / X",
      instagram: "📷 Instagram",
      email: "✉️ Email",
      other: "🔗 Contact",
    };

    function chip(sprite) {
      const thumb = sprite.image_url
        ? `<img src="${sprite.image_url}" style="width:16px; height:16px; object-fit:cover; border-radius:4px; vertical-align:middle; margin-right:0.35rem;" onerror="this.style.display='none'" />`
        : "";
      return `<span class="chip">${thumb}${sprite.variant_name}</span>`;
    }

    const RARITY_VAR = {
      common: "--rarity-common", raro: "--rarity-rare", epico: "--rarity-epic",
      legendario: "--rarity-legendary", mitico: "--rarity-mythic",
    };

    function itemSlot(sprite) {
      const borderColor = `var(${RARITY_VAR[sprite.rarity] || "--border"})`;
      const inner = sprite.image_url
        ? `<img src="${sprite.image_url}" onerror="this.parentElement.innerHTML='<span class=\\'placeholder\\'>❔</span>'" />`
        : `<span class="placeholder">❔</span>`;
      return `<div class="item-slot" style="border-color:${borderColor};" title="${sprite.variant_name} (${RARITY_LABELS[sprite.rarity] || sprite.rarity})">${inner}</div>`;
    }

    function itemSlotsRow(sprites, max = 8) {
      if (!sprites.length) return `<span style="color:var(--text-muted); font-size:0.85rem;">—</span>`;
      const shown = sprites.slice(0, max);
      const extra = sprites.length - shown.length;
      const extraTile = extra > 0
        ? `<div class="item-slot" style="background:var(--surface-hover); color:var(--text-muted); font-weight:600; font-size:0.85rem; border-style:dashed;">+${extra}</div>`
        : "";
      return `<div class="item-slots-row">${shown.map(itemSlot).join("")}${extraTile}</div>`;
    }

    // ---------------- Navegación entre vistas ----------------
    function showView(view) {
      document.getElementById("browse-section").style.display = view === "browse" ? "block" : "none";
      document.getElementById("mine-section").style.display = view === "mine" ? "block" : "none";
      document.getElementById("create-section").style.display = view === "create" ? "block" : "none";

      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      if (view === "browse") document.querySelector('.tab[data-tab="browse"]').classList.add("active");
      if (view === "mine") document.querySelector('.tab[data-tab="mine"]').classList.add("active");

      if (view === "create") loadUserSpritesForForm();
      if (view === "mine") loadMyTrades();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => showView(tab.dataset.tab));
    });
    document.getElementById("top-manage-btn").addEventListener("click", () => showView("mine"));
    document.getElementById("top-create-btn").addEventListener("click", () => showView("create"));

    // ---------------- Cargar datos base ----------------
    async function loadMatchMap() {
      const { data } = await db
        .from("user_trade_matches")
        .select("*")
        .or(`user_a.eq.${currentUser.id},user_b.eq.${currentUser.id}`);

      matchMap = {};
      (data || []).forEach(row => {
        const otherId = row.user_a === currentUser.id ? row.user_b : row.user_a;
        // Si ya hay un match 'full' registrado, no lo degradamos a 'partial'.
        if (matchMap[otherId] !== "full") matchMap[otherId] = row.match_type;
      });
    }

    async function loadVerifiedIds() {
      const { data } = await db.from("verified_users").select("user_id");
      verifiedIds = new Set((data || []).map(r => r.user_id));
    }

    async function loadSpriteCatalogForFilter() {
      const { data } = await db
        .from("sprites")
        .select("id, variant_name, rarity, image_url")
        .eq("is_active", true)
        .order("variant_name");
      allSpritesCatalog = data || [];
      renderSpriteFilterList("");
      populateStyleFilter();
    }

    function populateStyleFilter() {
      const styles = new Set(allSpritesCatalog.map(s => getSpriteType(s.variant_name)));
      const select = document.getElementById("filter-style");
      const current = select.value;
      select.innerHTML = `<option value="any">Any</option>` +
        [...styles].sort().map(s => `<option value="${s}">${s}</option>`).join("");
      select.value = current || "any";
    }

    function renderSpriteFilterList(term) {
      const list = document.getElementById("sprite-filter-list");
      const filtered = allSpritesCatalog.filter(s =>
        s.variant_name.toLowerCase().includes(term.toLowerCase())
      ).slice(0, 40);

      list.innerHTML = filtered.map(s => `
        <label class="sprite-filter-item">
          <input type="checkbox" value="${s.id}" class="sprite-filter-check" ${selectedSpriteFilterIds.has(s.id) ? "checked" : ""} />
          ${s.variant_name}
        </label>
      `).join("") || `<p style="color:var(--text-muted); font-size:0.85rem;">No matches.</p>`;

      list.querySelectorAll(".sprite-filter-check").forEach(cb => {
        cb.addEventListener("change", () => {
          if (cb.checked) selectedSpriteFilterIds.add(cb.value);
          else selectedSpriteFilterIds.delete(cb.value);
        });
      });
    }

    document.getElementById("sprite-filter-search").addEventListener("input", (e) => {
      renderSpriteFilterList(e.target.value);
    });

    async function loadTrades() {
      const area = document.getElementById("cards-area");
      area.innerHTML = `<p style="color: var(--text-muted);">Loading trades...</p>`;

      const { data, error } = await db
        .from("trades")
        .select(`
          id, title, description, status, created_at, user_id,
          profiles!trades_user_id_fkey ( username, avatar_url, contact_type, contact_value ),
          trade_offer_items ( sprites ( variant_name, rarity, image_url ) ),
          trade_want_items ( sprites ( variant_name, rarity, image_url ) )
        `)
        .order("created_at", { ascending: false });

      if (error) {
        area.innerHTML = `<div class="status-message error">${error.message}</div>`;
        return;
      }

      allTrades = data || [];
      currentPage = 1;
      renderBrowse();
    }

    // ---------------- Filtro + orden + paginación ----------------
    function getFilteredSortedTrades() {
      const term = document.getElementById("search-input").value.trim().toLowerCase();

      let list = allTrades.filter(trade => {
        if (appliedFilters.status !== "any" && trade.status !== appliedFilters.status) return false;

        if (appliedFilters.match !== "any") {
          const m = matchMap[trade.user_id];
          if (appliedFilters.match === "full" && m !== "full") return false;
          if (appliedFilters.match === "partial" && m !== "partial" && m !== "full") return false;
        }

        const allItems = [...trade.trade_offer_items, ...trade.trade_want_items].map(i => i.sprites);

        if (appliedFilters.rarity !== "any") {
          if (!allItems.some(s => s.rarity === appliedFilters.rarity)) return false;
        }

        if (appliedFilters.style !== "any") {
          if (!allItems.some(s => getSpriteType(s.variant_name) === appliedFilters.style)) return false;
        }

        if (appliedFilters.spriteIds.size > 0) {
          const itemNamesInTrade = new Set(allItems.map(s => s.variant_name));
          const spriteNamesSelected = [...appliedFilters.spriteIds]
            .map(id => allSpritesCatalog.find(s => s.id === id)?.variant_name)
            .filter(Boolean);
          if (!spriteNamesSelected.some(name => itemNamesInTrade.has(name))) return false;
        }

        if (term) {
          const haystack = [
            trade.title, trade.description, trade.profiles?.username,
            ...allItems.map(s => s.variant_name),
          ].filter(Boolean).join(" ").toLowerCase();
          if (!haystack.includes(term)) return false;
        }

        return true;
      });

      const sortOrder = document.getElementById("sort-select").value;
      list.sort((a, b) => {
        const diff = new Date(b.created_at) - new Date(a.created_at);
        return sortOrder === "newest" ? diff : -diff;
      });

      return list;
    }

    function tradeCardHtml(trade) {
      const match = matchMap[trade.user_id];
      const isOwn = trade.user_id === currentUser.id;
      const offerSprites = trade.trade_offer_items.map(i => i.sprites);
      const wantSprites = trade.trade_want_items.map(i => i.sprites);
      const contactValue = trade.profiles?.contact_value;
      const contactLabel = PLATFORM_ICONS[trade.profiles?.contact_type] || "🔗 Contact";

      return `
        <div class="trade-card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
            <div class="trade-owner">
              <div>
                <div style="font-size:0.9rem; font-weight:600;"><a href="u.html?u=${encodeURIComponent(trade.profiles?.username || '')}" style="text-decoration:none; color:inherit;">@${trade.profiles?.username || "user"}</a> ${verifiedCheck(trade.user_id)}${isOwn ? " (you)" : ""}</div>
                <div style="font-size:0.75rem; color:var(--text-muted);">${timeAgo(trade.created_at)}</div>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:0.3rem;">
              <span class="trade-status-badge trade-status-${trade.status}">${trade.status}</span>
              ${match ? `<span class="match-badge">${match === "full" ? "Full match" : "Partial match"}</span>` : ""}
            </div>
          </div>

          <div class="trade-card-title" style="margin-top:0.6rem;">${trade.title}</div>

          <div class="trade-columns-visual">
            <div>
              <div class="trade-col-label">Offering</div>
              ${itemSlotsRow(offerSprites)}
            </div>
            <div class="swap-icon">⇄</div>
            <div>
              <div class="trade-col-label">Looking for</div>
              ${itemSlotsRow(wantSprites)}
            </div>
          </div>

          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-ghost view-details-btn" style="padding:0.4rem 0.8rem;">👁 View Details</button>
            ${!isOwn ? `<button class="btn btn-ghost contact-btn" style="padding:0.4rem 0.8rem;">💬 Contact</button>` : ""}
          </div>
          <div class="details-panel">
            ${trade.description ? `<p style="margin:0 0 0.6rem;">${trade.description}</p>` : `<p style="margin:0 0 0.6rem;">No additional description.</p>`}
            <p style="margin:0 0 0.4rem;"><strong>Offering:</strong> ${offerSprites.map(s => s.variant_name).join(", ") || "—"}</p>
            <p style="margin:0 0 0.4rem;"><strong>Looking for:</strong> ${wantSprites.map(s => s.variant_name).join(", ") || "—"}</p>
            <p style="margin:0;">Posted ${new Date(trade.created_at).toLocaleDateString()}</p>
          </div>
          <div class="contact-reveal">
            ${contactValue
              ? `${contactLabel}: <strong style="color:var(--text);">${contactValue}</strong>`
              : `This user hasn't shared any contact info yet.`}
          </div>
        </div>
      `;
    }

    function renderBrowse() {
      const area = document.getElementById("cards-area");
      const filtered = getFilteredSortedTrades();

      if (filtered.length === 0) {
        area.innerHTML = `<div class="empty-state">No trades match your filters.</div>`;
        document.getElementById("pagination").innerHTML = "";
        return;
      }

      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      currentPage = Math.min(currentPage, totalPages);
      const pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      area.innerHTML = pageItems.map(tradeCardHtml).join("");

      area.querySelectorAll(".view-details-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const panel = btn.closest(".trade-card").querySelector(".details-panel");
          panel.classList.toggle("open");
          panel.style.display = panel.classList.contains("open") ? "block" : "none";
        });
      });

      area.querySelectorAll(".contact-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const reveal = btn.closest(".trade-card").querySelector(".contact-reveal");
          reveal.classList.toggle("open");
        });
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const el = document.getElementById("pagination");
      if (totalPages <= 1) { el.innerHTML = ""; return; }

      let html = `<button ${currentPage === 1 ? "disabled" : ""} data-page="${currentPage - 1}">←</button>`;
      for (let p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) {
          html += `<button class="${p === currentPage ? "active" : ""}" data-page="${p}">${p}</button>`;
        } else if (Math.abs(p - currentPage) === 2) {
          html += `<span style="color:var(--text-muted); padding:0.4rem;">…</span>`;
        }
      }
      html += `<button ${currentPage === totalPages ? "disabled" : ""} data-page="${currentPage + 1}">→</button>`;
      el.innerHTML = html;

      el.querySelectorAll("button[data-page]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentPage = parseInt(btn.dataset.page, 10);
          renderBrowse();
        });
      });
    }

    document.getElementById("search-input").addEventListener("input", () => {
      currentPage = 1;
      renderBrowse();
    });
    document.getElementById("sort-select").addEventListener("change", () => renderBrowse());

    document.getElementById("apply-filters-btn").addEventListener("click", () => {
      appliedFilters = {
        status: document.getElementById("filter-status").value,
        match: document.getElementById("filter-match").value,
        rarity: document.getElementById("filter-rarity").value,
        style: document.getElementById("filter-style").value,
        spriteIds: new Set(selectedSpriteFilterIds),
      };
      currentPage = 1;
      renderBrowse();
    });

    document.getElementById("clear-filters-btn").addEventListener("click", () => {
      document.getElementById("filter-status").value = "any";
      document.getElementById("filter-match").value = "any";
      document.getElementById("filter-rarity").value = "any";
      document.getElementById("filter-style").value = "any";
      selectedSpriteFilterIds.clear();
      document.getElementById("sprite-filter-search").value = "";
      renderSpriteFilterList("");
      appliedFilters = { status: "any", match: "any", rarity: "any", style: "any", spriteIds: new Set() };
      currentPage = 1;
      renderBrowse();
    });

    document.getElementById("grid-view-btn").addEventListener("click", () => {
      viewMode = "grid";
      document.getElementById("cards-area").className = "cards-area grid-view";
      document.getElementById("grid-view-btn").classList.add("active");
      document.getElementById("list-view-btn").classList.remove("active");
    });
    document.getElementById("list-view-btn").addEventListener("click", () => {
      viewMode = "list";
      document.getElementById("cards-area").className = "cards-area list-view";
      document.getElementById("list-view-btn").classList.add("active");
      document.getElementById("grid-view-btn").classList.remove("active");
    });

    // ---------------- My Trades: manage (edit / pause / reactivate / delete) ----------------
    async function loadMyTrades() {
      const list = document.getElementById("mine-list");
      list.innerHTML = `<p style="color: var(--text-muted);">Loading your trades...</p>`;

      const { data, error } = await db
        .from("trades")
        .select(`
          id, title, description, status, created_at,
          trade_offer_items ( sprites ( variant_name, rarity, image_url ) ),
          trade_want_items ( sprites ( variant_name, rarity, image_url ) )
        `)
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = `<div class="status-message error">${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = `<div class="empty-state">You haven't created any trades yet.</div>`;
        return;
      }

      list.innerHTML = "";
      data.forEach(trade => {
        const offerSprites = trade.trade_offer_items.map(i => i.sprites);
        const wantSprites = trade.trade_want_items.map(i => i.sprites);
        const isActive = trade.status === "active";
        const isCancelled = trade.status === "cancelled";

        const card = document.createElement("div");
        card.className = "trade-card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap: 0.6rem; flex-wrap: wrap;">
            <div style="display:flex; align-items:center; gap:0.6rem;">
              <div class="trade-card-title">${trade.title}</div>
              <span class="trade-status-badge trade-status-${trade.status}">${trade.status}</span>
            </div>
            <span style="color:var(--text-muted); font-size:0.75rem;">${timeAgo(trade.created_at)}</span>
          </div>
          ${trade.description ? `<p style="color: var(--text-muted); font-size:0.9rem; margin:0;">${trade.description}</p>` : ""}
          <div class="trade-columns-visual">
            <div>
              <div class="trade-col-label">Offering</div>
              ${itemSlotsRow(offerSprites)}
            </div>
            <div class="swap-icon">⇄</div>
            <div>
              <div class="trade-col-label">Looking for</div>
              ${itemSlotsRow(wantSprites)}
            </div>
          </div>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-ghost edit-btn" style="padding:0.4rem 0.8rem;">✎ Edit</button>
            ${isActive ? `<button class="btn btn-ghost pause-btn" style="padding:0.4rem 0.8rem;">◌ Pause</button>` : ""}
            ${isActive ? `<button class="btn btn-ghost complete-btn" style="padding:0.4rem 0.8rem;">✓ Mark Completed</button>` : ""}
            ${isCancelled ? `<button class="btn btn-ghost reactivate-btn" style="padding:0.4rem 0.8rem;">↻ Reactivate</button>` : ""}
            <button class="btn btn-danger delete-btn" style="padding:0.4rem 0.8rem;">🗑 Delete</button>
          </div>
          <div class="edit-form" style="display:none; margin-top: 0.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <label>Title</label>
            <input type="text" class="edit-title-input" value="${trade.title.replace(/"/g, '&quot;')}" maxlength="100" />
            <label>Description</label>
            <textarea class="edit-desc-input" maxlength="2000">${trade.description || ""}</textarea>
            <div class="edit-status"></div>
            <button class="btn btn-primary save-edit-btn" style="padding:0.5rem 1rem;">Save changes</button>
            <button class="btn btn-ghost cancel-edit-btn" style="padding:0.5rem 1rem;">Cancel</button>
          </div>
        `;

        const editForm = card.querySelector(".edit-form");

        card.querySelector(".edit-btn").addEventListener("click", () => {
          editForm.style.display = editForm.style.display === "none" ? "block" : "none";
        });

        card.querySelector(".cancel-edit-btn").addEventListener("click", () => {
          editForm.style.display = "none";
        });

        card.querySelector(".save-edit-btn").addEventListener("click", async () => {
          const statusEl = card.querySelector(".edit-status");
          const newTitle = card.querySelector(".edit-title-input").value.trim();
          const newDesc = card.querySelector(".edit-desc-input").value.trim();

          if (newTitle.length < 3) {
            statusEl.innerHTML = `<div class="status-message error">Title needs at least 3 characters.</div>`;
            return;
          }
          if (containsProfanity(newTitle) || containsProfanity(newDesc)) {
            statusEl.innerHTML = `<div class="status-message error">Please remove inappropriate language.</div>`;
            return;
          }

          const { error } = await db
            .from("trades")
            .update({ title: newTitle, description: newDesc || null })
            .eq("id", trade.id);

          if (error) {
            statusEl.innerHTML = `<div class="status-message error">${error.message}</div>`;
            return;
          }

          loadMyTrades();
        });

        const pauseBtn = card.querySelector(".pause-btn");
        if (pauseBtn) {
          pauseBtn.addEventListener("click", async () => {
            await db.from("trades").update({ status: "cancelled" }).eq("id", trade.id);
            loadMyTrades();
          });
        }

        const completeBtn = card.querySelector(".complete-btn");
        if (completeBtn) {
          completeBtn.addEventListener("click", async () => {
            const partnerUsername = prompt(`Mark "${trade.title}" as completed. Who did you trade with? (their username, optional but unlocks trading achievements)`);
            if (partnerUsername === null) return; // canceló

            let completedWithId = null;
            if (partnerUsername.trim()) {
              const { data: partnerProfile } = await db
                .from("profiles")
                .select("id")
                .ilike("username", partnerUsername.trim())
                .maybeSingle();

              if (!partnerProfile) {
                alert(`No user found with username "${partnerUsername.trim()}". Marking as completed without a trade partner.`);
              } else {
                completedWithId = partnerProfile.id;
              }
            }

            await db.from("trades").update({ status: "completed", completed_with_user_id: completedWithId }).eq("id", trade.id);
            await db.rpc("check_achievements");
            loadMyTrades();
          });
        }

        const reactivateBtn = card.querySelector(".reactivate-btn");
        if (reactivateBtn) {
          reactivateBtn.addEventListener("click", async () => {
            await db.from("trades").update({ status: "active" }).eq("id", trade.id);
            loadMyTrades();
          });
        }

        card.querySelector(".delete-btn").addEventListener("click", async () => {
          if (!confirm(`Delete trade "${trade.title}"? This can't be undone.`)) return;
          await db.from("trades").delete().eq("id", trade.id);
          loadMyTrades();
        });

        list.appendChild(card);
      });
    }

    // ---------------- Create trade ----------------
    let offerSpritesForForm = [];
    let wantSpritesForForm = [];
    let selectedOfferIds = new Set();
    let selectedWantIds = new Set();

    async function loadUserSpritesForForm() {
      const [{ data: owned }, { data: wanted }] = await Promise.all([
        db.from("user_sprites_owned").select("sprite_id, sprites(variant_name, rarity, image_url)").eq("user_id", currentUser.id),
        db.from("user_sprites_wanted").select("sprite_id, sprites(variant_name, rarity, image_url)").eq("user_id", currentUser.id),
      ]);

      offerSpritesForForm = (owned || []).map(o => ({ id: o.sprite_id, ...o.sprites }));
      wantSpritesForForm = (wanted || []).map(w => ({ id: w.sprite_id, ...w.sprites }));
      selectedOfferIds = new Set();
      selectedWantIds = new Set();

      renderPickerGrid("offer-picker-grid", offerSpritesForForm, selectedOfferIds, "", "Add Sprites to your collection first.");
      renderPickerGrid("want-picker-grid", wantSpritesForForm, selectedWantIds, "", "Add Sprites to your wishlist first.");
      updateCreatePreview();
    }

    function pickerTileHtml(sprite, selected) {
      const img = sprite.image_url
        ? `<img src="${sprite.image_url}" onerror="this.outerHTML='<div class=\\'placeholder-img\\'>❔</div>'" />`
        : `<div class="placeholder-img">❔</div>`;
      return `
        <div class="picker-tile ${selected ? "selected" : ""}" data-id="${sprite.id}">
          <div class="picker-tile-check">✓</div>
          ${img}
          <div class="picker-tile-name">${sprite.variant_name}</div>
        </div>
      `;
    }

    function renderPickerGrid(containerId, sprites, selectedSet, term, emptyMessage) {
      const container = document.getElementById(containerId);
      const filtered = sprites.filter(s => s.variant_name.toLowerCase().includes(term.toLowerCase()));

      if (sprites.length === 0) {
        container.innerHTML = `<div class="picker-empty">${emptyMessage}</div>`;
        return;
      }
      if (filtered.length === 0) {
        container.innerHTML = `<div class="picker-empty">No matches.</div>`;
        return;
      }

      container.innerHTML = filtered.map(s => pickerTileHtml(s, selectedSet.has(s.id))).join("");

      container.querySelectorAll(".picker-tile").forEach(tile => {
        tile.addEventListener("click", () => {
          const id = tile.dataset.id;
          if (selectedSet.has(id)) selectedSet.delete(id);
          else selectedSet.add(id);
          tile.classList.toggle("selected");
          updateCreatePreview();
        });
      });
    }

    document.getElementById("offer-search").addEventListener("input", (e) => {
      renderPickerGrid("offer-picker-grid", offerSpritesForForm, selectedOfferIds, e.target.value, "Add Sprites to your collection first.");
    });
    document.getElementById("want-search").addEventListener("input", (e) => {
      renderPickerGrid("want-picker-grid", wantSpritesForForm, selectedWantIds, e.target.value, "Add Sprites to your wishlist first.");
    });

    document.getElementById("select-all-offer-btn").addEventListener("click", () => {
      const allSelected = offerSpritesForForm.length > 0 && offerSpritesForForm.every(s => selectedOfferIds.has(s.id));
      selectedOfferIds = new Set(allSelected ? [] : offerSpritesForForm.map(s => s.id));
      renderPickerGrid("offer-picker-grid", offerSpritesForForm, selectedOfferIds, document.getElementById("offer-search").value, "Add Sprites to your collection first.");
      updateCreatePreview();
    });

    document.getElementById("select-all-want-btn").addEventListener("click", () => {
      const allSelected = wantSpritesForForm.length > 0 && wantSpritesForForm.every(s => selectedWantIds.has(s.id));
      selectedWantIds = new Set(allSelected ? [] : wantSpritesForForm.map(s => s.id));
      renderPickerGrid("want-picker-grid", wantSpritesForForm, selectedWantIds, document.getElementById("want-search").value, "Add Sprites to your wishlist first.");
      updateCreatePreview();
    });

    function updateCreatePreview() {
      const title = document.getElementById("trade-title").value.trim() || "Your trade title will appear here";
      const description = document.getElementById("trade-description").value.trim();
      const offerSelected = offerSpritesForForm.filter(s => selectedOfferIds.has(s.id));
      const wantSelected = wantSpritesForForm.filter(s => selectedWantIds.has(s.id));

      document.getElementById("create-preview").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
          <div style="font-size:0.9rem; font-weight:600;">@${currentUsername} (you)</div>
          <span class="trade-status-badge" style="background:rgba(139,92,246,0.15); color:var(--accent);">draft</span>
        </div>
        <div class="trade-card-title" style="margin-top:0.6rem;">${title}</div>
        ${description ? `<p style="color:var(--text-muted); font-size:0.88rem; margin:0.3rem 0 0;">${description}</p>` : ""}
        <div class="trade-columns-visual">
          <div>
            <div class="trade-col-label">Offering</div>
            ${itemSlotsRow(offerSelected)}
          </div>
          <div class="swap-icon">⇄</div>
          <div>
            <div class="trade-col-label">Looking for</div>
            ${itemSlotsRow(wantSelected)}
          </div>
        </div>
      `;
    }

    document.getElementById("trade-title").addEventListener("input", updateCreatePreview);
    document.getElementById("trade-description").addEventListener("input", updateCreatePreview);

    document.getElementById("create-trade-btn").addEventListener("click", async () => {
      const statusEl = document.getElementById("create-status");
      const title = document.getElementById("trade-title").value.trim();
      const description = document.getElementById("trade-description").value.trim();
      const offerIds = [...selectedOfferIds];
      const wantIds = [...selectedWantIds];

      if (title.length < 3) {
        statusEl.innerHTML = `<div class="status-message error">Title needs at least 3 characters.</div>`;
        return;
      }
      if (containsProfanity(title) || containsProfanity(description)) {
        statusEl.innerHTML = `<div class="status-message error">Please remove inappropriate language from your title or description.</div>`;
        return;
      }
      if (offerIds.length === 0) {
        statusEl.innerHTML = `<div class="status-message error">Select at least one Sprite to offer.</div>`;
        return;
      }
      if (offerIds.length > 50 || wantIds.length > 50) {
        statusEl.innerHTML = `<div class="status-message error">You can include at most 50 Sprites per side in a single trade.</div>`;
        return;
      }

      const { data: trade, error: tradeError } = await db
        .from("trades")
        .insert({ user_id: currentUser.id, title, description: description || null })
        .select()
        .single();

      if (tradeError) {
        statusEl.innerHTML = `<div class="status-message error">${tradeError.message}</div>`;
        return;
      }

      const offerRows = offerIds.map(id => ({ trade_id: trade.id, sprite_id: id }));
      const wantRows = wantIds.map(id => ({ trade_id: trade.id, sprite_id: id }));

      const inserts = [db.from("trade_offer_items").insert(offerRows)];
      if (wantRows.length > 0) {
        inserts.push(db.from("trade_want_items").insert(wantRows));
      }

      const results = await Promise.all(inserts);
      const offerError = results[0].error;
      const wantError = results[1]?.error;

      if (offerError || wantError) {
        const detail = offerError?.message || wantError?.message || "Unknown error.";
        statusEl.innerHTML = `<div class="status-message error">Trade created, but there was a problem saving the items: ${detail}</div>`;
        return;
      }

      statusEl.innerHTML = `<div class="status-message success">Trade posted!</div>`;
      db.rpc("check_achievements").then(() => {});
      document.getElementById("trade-title").value = "";
      document.getElementById("trade-description").value = "";
      selectedOfferIds = new Set();
      selectedWantIds = new Set();

      showView("browse");
      loadTrades();
    });

    (async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;

      const { data: profile } = await db.from("profiles").select("username").eq("id", currentUser.id).maybeSingle();
      currentUsername = profile?.username || "you";

      await renderNav("trades.html");
      await loadMatchMap();
      await loadVerifiedIds();
      await loadSpriteCatalogForFilter();
      await loadTrades();
    })();
  </script>
</body>
