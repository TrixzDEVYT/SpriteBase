<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpriteBase — Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title" id="form-title">Welcome back</h1>
      <p class="auth-subtitle" id="form-subtitle">Sign in to your SpriteBase account</p>

      <div id="status-box"></div>

      <form id="auth-form">
        <div id="username-field" style="display:none;">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Trixie" />
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6" />

        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; margin-top: 0.3rem;">
          Sign In
        </button>
      </form>

      <div class="auth-switch">
        <span id="switch-text">Don't have an account?</span>
        <button id="switch-btn">Sign up</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script>
    let mode = "login"; // or "signup"

    const form = document.getElementById("auth-form");
    const statusBox = document.getElementById("status-box");
    const submitBtn = document.getElementById("submit-btn");

    function setMode(newMode) {
      mode = newMode;
      const isSignup = mode === "signup";
      document.getElementById("form-title").textContent =
        isSignup ? "Create your account" : "Welcome back";
      document.getElementById("form-subtitle").textContent =
        isSignup ? "Start organizing your trades" : "Sign in to your SpriteBase account";
      document.getElementById("username-field").style.display = isSignup ? "block" : "none";
      document.getElementById("username").required = isSignup;
      submitBtn.textContent = isSignup ? "Create Account" : "Sign In";
      document.getElementById("switch-text").textContent =
        isSignup ? "Already have an account?" : "Don't have an account?";
      document.getElementById("switch-btn").textContent =
        isSignup ? "Sign In" : "Sign up";
      statusBox.innerHTML = "";
    }

    document.getElementById("switch-btn").addEventListener("click", () => {
      setMode(mode === "login" ? "signup" : "login");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusBox.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const username = document.getElementById("username").value.trim();

      const result = mode === "signup"
        ? await signUp(email, password, username)
        : await signIn(email, password);

      if (result.error) {
        statusBox.innerHTML = `<div class="status-message error">${result.error.message}</div>`;
        submitBtn.disabled = false;
        return;
      }

      window.location.href = "dashboard.html";
    });

    redirectIfLoggedIn();
  </script>
</body>
</html>
