<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpriteBase — Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <div class="page">
    <div class="page-header">
      <h1 id="welcome-title">Welcome</h1>
      <p>Here's your SpriteBase summary.</p>
    </div>

    <div id="news-feed" style="margin-bottom: 1.5rem;"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-owned">—</div>
        <div class="stat-label">Sprites in your collection</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-wanted">—</div>
        <div class="stat-label">Sprites you're looking for</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-trades">—</div>
        <div class="stat-label">Active trades</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 1rem;">Quick actions</h3>
      <div style="display:flex; gap: 0.8rem; flex-wrap: wrap;">
        <a href="collection.html" class="btn btn-primary">Edit my collection</a>
        <a href="trades.html" class="btn btn-ghost">View trades</a>
      </div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
      <h3 style="margin-bottom: 0.4rem;">Contact info</h3>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top:0; margin-bottom: 1rem;">
        Shown to other users on your trades so they can reach you (Discord, etc). Leave blank to hide it.
      </p>
      <label for="contact-type">Platform</label>
      <select id="contact-type">
        <option value="discord">Discord</option>
        <option value="twitter">Twitter / X</option>
        <option value="instagram">Instagram</option>
        <option value="email">Email</option>
        <option value="other">Other</option>
      </select>
      <label for="contact-input">Username / handle</label>
      <input type="text" id="contact-input" placeholder="username" maxlength="100" />
      <div id="contact-status"></div>
      <button class="btn btn-primary" id="save-contact-btn">Save</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;

      await renderNav("dashboard.html");

      const { data: profile } = await db
        .from("profiles")
        .select("username, contact_type, contact_value")
        .eq("id", user.id)
        .maybeSingle();

      document.getElementById("welcome-title").textContent =
        "Welcome, " + (profile?.username || "back");

      document.getElementById("contact-type").value = profile?.contact_type || "discord";
      document.getElementById("contact-input").value = profile?.contact_value || "";

      // Noticias
      const { data: newsItems } = await db
        .from("news")
        .select("id, title, body, image_url, created_at")
        .eq("is_published", true)
        .order("created_at", { ascending: false })
        .limit(5);

      const feedEl = document.getElementById("news-feed");
      if (newsItems && newsItems.length > 0) {
        const escapeHtml = (str) => {
          const div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        };
        feedEl.innerHTML = newsItems.map(n => `
          <div class="card" style="margin-bottom: 0.8rem;">
            ${n.image_url ? `<img src="${n.image_url}" style="width:100%; max-height:220px; object-fit:cover; border-radius:10px; margin-bottom:0.8rem;" onerror="this.style.display='none'" />` : ""}
            <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:0.4rem;">
              <div style="font-family: var(--font-display); font-size:1.1rem;">${escapeHtml(n.title)}</div>
              <div style="color:var(--text-muted); font-size:0.78rem;">${new Date(n.created_at).toLocaleDateString()}</div>
            </div>
            <div style="font-size:0.9rem; color:var(--text-muted); margin-top:0.4rem;">${escapeHtml(n.body).replace(/\n/g, "<br>")}</div>
          </div>
        `).join("");
      }

      document.getElementById("save-contact-btn").addEventListener("click", async () => {
        const statusEl = document.getElementById("contact-status");
        const type = document.getElementById("contact-type").value;
        const value = document.getElementById("contact-input").value.trim();

        const { error } = await db
          .from("profiles")
          .update({
            contact_type: value ? type : null,
            contact_value: value || null,
          })
          .eq("id", user.id);

        statusEl.innerHTML = error
          ? `<div class="status-message error">${error.message}</div>`
          : `<div class="status-message success">Saved.</div>`;
      });

      const [{ count: ownedCount }, { count: wantedCount }, { count: tradesCount }] =
        await Promise.all([
          db.from("user_sprites_owned").select("*", { count: "exact", head: true }).eq("user_id", user.id),
          db.from("user_sprites_wanted").select("*", { count: "exact", head: true }).eq("user_id", user.id),
          db.from("trades").select("*", { count: "exact", head: true }).eq("user_id", user.id).eq("status", "active"),
        ]);

      document.getElementById("stat-owned").textContent = ownedCount ?? 0;
      document.getElementById("stat-wanted").textContent = wantedCount ?? 0;
      document.getElementById("stat-trades").textContent = tradesCount ?? 0;
    })();
  </script>
</body>
</html>
